<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Play DepotReplay, a deterministic dispatch strategy game.">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <title>DepotReplay — Play in Browser</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #070b12;
            color: #e8eef9;
        }

        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            margin: 0;
            background:
                    radial-gradient(circle at 20% 0%, rgba(97, 218, 251, 0.13), transparent 38rem),
                    #070b12;
        }

        main {
            width: min(100%, 1360px);
            margin: 0 auto;
            padding: 20px;
        }

        header {
            display: flex;
            align-items: end;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 14px;
        }

        h1 {
            margin: 0;
            font-size: clamp(1.35rem, 3vw, 2rem);
            letter-spacing: 0.04em;
        }

        p {
            margin: 5px 0 0;
            color: #91a1bb;
            line-height: 1.45;
        }

        a { color: #61dafb; }

        .game-frame {
            overflow: hidden;
            width: 100%;
            aspect-ratio: 8 / 5;
            border: 1px solid #30415f;
            border-radius: 14px;
            background: #0d1321;
            box-shadow: 0 24px 70px rgba(0, 0, 0, 0.45);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            border: 0;
            outline: none;
        }

        .hint {
            margin-top: 12px;
            font-size: 0.9rem;
        }

        kbd {
            padding: 2px 6px;
            border: 1px solid #52637e;
            border-bottom-width: 2px;
            border-radius: 5px;
            background: #151e31;
            color: #fff;
            font: inherit;
            font-size: 0.82rem;
        }

        @media (max-width: 760px) {
            main { padding: 12px; }
            header { align-items: start; flex-direction: column; }
            .game-frame { border-radius: 8px; }
        }
    </style>
</head>
<body oncontextmenu="return false">
<main>
    <header>
        <div>
            <h1>DepotReplay</h1>
            <p>Dispatch two vehicles, meet deadlines, and compare your score with deterministic strategies.</p>
        </div>
        <a href="https://github.com/b2ty9t7yhz-source/depotreplay">Source and documentation</a>
    </header>
    <section class="game-frame" aria-label="DepotReplay game">
        <canvas id="canvas" tabindex="0" aria-label="DepotReplay interactive game canvas"></canvas>
    </section>
    <p class="hint">
        Click the game, then use <kbd>1</kbd>/<kbd>2</kbd> for vehicles,
        <kbd>↑</kbd>/<kbd>↓</kbd> for tasks, <kbd>P</kbd>/<kbd>D</kbd> to dispatch,
        <kbd>Space</kbd> to advance, and <kbd>A</kbd> for an automatic step.
    </p>
</main>
<script>
    async function start() {
        main();
        document.getElementById("canvas").focus();
    }
    window.addEventListener("load", start);
</script>
<script src="depotreplay.js"></script>
</body>
</html>
