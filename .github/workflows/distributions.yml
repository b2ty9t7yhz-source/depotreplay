name: Distributions

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/distributions.yml"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "core/**"
      - "game/**"
      - "desktop/**"
      - "web/**"
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  native-installers:
    name: ${{ matrix.artifact }} installer
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            artifact: depotreplay-macos-pkg
          - os: windows-latest
            artifact: depotreplay-windows-msi
          - os: ubuntu-latest
            artifact: depotreplay-linux-deb
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes fakeroot

      - name: Build installer
        if: runner.os != 'Windows'
        run: ./gradlew clean check :desktop:jpackageInstaller --no-configuration-cache --no-daemon

      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: .\gradlew.bat clean check :desktop:jpackageInstaller --no-configuration-cache --no-daemon

      - name: Upload installer and checksum
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: desktop/build/jpackage/installer/
          if-no-files-found: error

  web-site:
    name: Browser build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build static site
        run: ./gradlew :web:webDist --no-configuration-cache --no-daemon

      - name: Upload static site
        uses: actions/upload-artifact@v7
        with:
          name: depotreplay-web
          path: web/build/site/
          if-no-files-found: error
